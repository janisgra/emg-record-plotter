; emg-record-plotter firmware -- raw 4-channel EMG exfiltration over UDP
;
;   pio run -e esp32s3-n16r8 -t upload      # ESP32-S3-DevKitC (N16R8), EMG on GPIO1-4
;   pio run -e xiao-esp32s3  -t upload      # Seeed XIAO ESP32-S3, EMG on GPIO5,2,3,4
;   pio device monitor                      # 1 status line per second
;
; Network target, WiFi and rates: see the CONFIG block in src/main.cpp
; (every value there can also be overridden here with -D...).

[platformio]
default_envs = esp32s3-n16r8

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; ESP32-S3-DevKitC-1 N16R8 -- ADC1 CH0..CH3 = GPIO1..GPIO4 (same pins as
; emg_esp_ML_classifier-exfiltrator, so the existing wiring works unchanged)
[env:esp32s3-n16r8]
board = esp32-s3-devkitc-1
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
build_flags =
    -DDEVICE_ID=6
    -DEMG_ADC_CHANNELS=0,1,2,3
    ; measured at RSSI -22 dBm (board next to the router): 8 dBm gave fewer
    ; retransmissions than the 20 dBm default.  Remove if the board is far away.
    -DWIFI_TX_POWER_DBM=8
    ; legacy int32 packets for emg_classifier_ui (needs ~6x more WiFi frames):
    ; -DWIRE_FORMAT=1
    ; absolute ADC maximum on the S3 (83333 total = 20.8 kHz/ch):
    ; -DADC_SAMPLE_FREQ_HZ=83333

; Seeed XIAO ESP32-S3 -- ADC1 CH4,1,2,3 = GPIO5 (A4), GPIO2 (A1), GPIO3 (A2),
; GPIO4 (A3): same channel order as emg_exfiltrator_node/src/esp32_mini_4ch.cpp
[env:xiao-esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    -DDEVICE_ID=5
    -DEMG_ADC_CHANNELS=4,1,2,3
